name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev libffi-dev libssl-dev ffmpeg
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer python-for-android

      - name: Purge System NDK 27 & Reset Variables
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk/27*
          sudo rm -rf /usr/local/lib/android/sdk/ndk-bundle
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=" >> $GITHUB_ENV
          echo "ANDROID_NDK_LATEST_HOME=" >> $GITHUB_ENV

      - name: Build with Buildozer
        env:
          BUILDOZER_ALLOW_SDK_COMPONENTS_REINSTALL: 1
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikFPS-APK
          path: bin/*.apk
