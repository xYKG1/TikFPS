name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          pip install "setuptools<69.0.0" "wheel" "cython<0.30.0,>=0.29.33" "sh<2.0,>=1.10" "buildozer==1.5.0"

      - name: Clean Old Cache
        run: |
          rm -rf .buildozer/

      - name: Build with Buildozer
        env:
          ANDROID_NDK_HOME: ''
          ANDROID_NDK_ROOT: ''
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikFPS-APK
          path: bin/*.apk
